<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520">
<defs><style>.t{font-family:Arial,sans-serif;fill:#f4f7f1}.s{font-family:Arial,sans-serif;fill:#9aa496}.b{fill:#171a17;stroke:#343a34;stroke-width:2}.g{fill:#d7ff63}.l{stroke:#6d766a;stroke-width:2;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6d766a"/></marker></defs>
<rect width="1200" height="520" rx="24" fill="#101210"/>
<text x="54" y="64" class="t" font-size="24" font-weight="700">LedgerLens iOS architecture</text><text x="54" y="91" class="s" font-size="14">SwiftUI views render observable state; services own side effects; protocols make the network layer replaceable in tests.</text>
