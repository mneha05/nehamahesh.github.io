<rect class="b" x="470" y="145" width="260" height="245" rx="20"/><text class="g" x="495" y="178" font-size="13" font-family="Arial" font-weight="700">STATE</text><text class="t" x="495" y="220" font-size="22" font-weight="700">@Observable MVVM</text><text class="s" x="495" y="253" font-size="14">DashboardViewModel</text><text class="s" x="495" y="278" font-size="14">ApprovalViewModel</text><text class="s" x="495" y="303" font-size="14">Loading / error states</text><text class="s" x="495" y="328" font-size="14">Derived budget metrics</text>
