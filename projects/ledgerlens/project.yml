name: LedgerLens
options:
  bundleIdPrefix: dev.nehamahesh
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: ""
targets:
  LedgerLens:
    type: application
    platform: iOS
    sources:
      - path: ios/LedgerLens
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nehamahesh.LedgerLens
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
  LedgerLensTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ios/LedgerLensTests
    dependencies:
      - target: LedgerLens
